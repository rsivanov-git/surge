#!MANAGED-CONFIG https://raw.githubusercontent.com/rsivanov-git/surge/main/DefaultChinese.conf
[General]
loglevel = warning
udp-policy-not-supported-behaviour = REJECT
dns-server = system
#encrypted-dns-server = https://dns.nextdns.io
use-local-host-item-for-proxy = true
hijack-dns = *:53
internet-test-url = https://www.gstatic.com/generate_204
proxy-test-url = https://www.gstatic.com/generate_204

[Proxy Group]
PROXY = select, DIRECT, REJECT

[Host]
ntc.party = 130.255.77.28

[Rule]
RULE-SET,SYSTEM,DIRECT
RULE-SET,LAN,DIRECT,no-resolve
DOMAIN,_test.local,REJECT,pre-matching
DOMAIN-WILDCARD,*netseer-ipaddr-assoc.xy.fbcdn.net,REJECT-NO-DROP,pre-matching
DOMAIN-WILDCARD,*netseer-ipaddr-assoc.xz.fbcdn.net,REJECT-NO-DROP,pre-matching
DOMAIN-WILDCARD,*netseer.xy.fbcdn.net,REJECT-NO-DROP,pre-matching
DOMAIN-WILDCARD,*netseer.xz.fbcdn.net,REJECT-NO-DROP,pre-matching
RULE-SET,https://surge.bojin.co/geosite/full/apple,DIRECT
RULE-SET,https://raw.githubusercontent.com/rsivanov-git/surge/main/Direct.txt,DIRECT
#China & Russia
DOMAIN-SUFFIX,CN,DIRECT
RULE-SET,https://surge.bojin.co/geosite/full/category-ru,DIRECT
GEOIP,RU,DIRECT,no-resolve
GEOIP,CN,DIRECT,no-resolve
# Final
FINAL,PROXY
